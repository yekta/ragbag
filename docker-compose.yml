# Self-host / local backend stack (plan §11): API server + zero-cache + Postgres.
# Copy .env.example → .env first. Web/desktop/mobile clients connect from outside.
# Dev tip: `docker compose up -d postgres` and run server + zero-cache via pnpm.

services:
  # When compose runs the database, POSTGRES_PASSWORD is the ONLY database
  # setting: the two connection strings below are built from it, which is why
  # neither DATABASE_URL nor ZERO_UPSTREAM_DB from .env reaches a container.
  # They cannot be one variable, because the host differs on either side of this
  # network (`postgres` in here, `localhost` out there) and because the postgres
  # image initialises from a password rather than from a URL.
  postgres:
    # Stock Postgres: embeddings are gone (entities do that work at write time
    # now, plan §7), so nothing here needs pgvector any more.
    image: postgres:17
    command: postgres -c wal_level=logical # required by Zero's logical replication
    environment:
      POSTGRES_DB: ragbag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U postgres -d ragbag
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/ragbag
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3001}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      # No S3 bucket? Blobs land on the mounted volume below instead.
      LOCAL_BLOB_DIR: ${LOCAL_BLOB_DIR:-/data/blobs}
      # Ingestion/AI (plan §5): without a key the local extraction still runs;
      # descriptions, transcripts, summaries, tags and entities are skipped.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      AI_ENRICH_MODEL: ${AI_ENRICH_MODEL:-}
      AI_TRANSCRIBE_MODEL: ${AI_TRANSCRIBE_MODEL:-}
      FFMPEG_PATH: ${FFMPEG_PATH:-}
      # The cost lever on scanned PDFs: pages rendered, not calls (plan §5.2).
      AI_PDF_DETAIL: ${AI_PDF_DETAIL:-low}
      AI_PDF_MAX_PAGES: ${AI_PDF_MAX_PAGES:-50}
      INGEST_WORKER: ${INGEST_WORKER:-true}
      INGEST_CONCURRENCY: ${INGEST_CONCURRENCY:-2}
    ports:
      - "3001:3001"
    volumes:
      - server-blobs:/data/blobs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://localhost:3001/health'').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"',
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  zero-cache:
    image: rocicorp/zero:1.8.0
    environment:
      ZERO_UPSTREAM_DB: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/ragbag
      ZERO_REPLICA_FILE: /data/replica.db
      ZERO_APP_PUBLICATIONS: zero_data
      ZERO_ADMIN_PASSWORD: ${ZERO_ADMIN_PASSWORD:-change-me}
      ZERO_MUTATE_URL: http://server:3001/api/zero/mutate
      ZERO_QUERY_URL: http://server:3001/api/zero/query
      ZERO_MUTATE_FORWARD_COOKIES: "true"
      ZERO_QUERY_FORWARD_COOKIES: "true"
      ZERO_ENABLE_CRUD_MUTATIONS: "false"
    ports:
      - "4848:4848"
    volumes:
      - zero-replica:/data
    depends_on:
      server:
        # Migrations (tables + zero_data publication) must exist first.
        condition: service_healthy
    stop_grace_period: 10m
    healthcheck:
      test: curl -f http://localhost:4848/keepalive
      interval: 5s
      start_period: 10m

volumes:
  postgres-data:
  zero-replica:
  server-blobs:

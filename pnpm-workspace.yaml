# Workspace layout (§3 of the plan): apps consume packages; packages export raw .ts
packages:
  - apps/*
  - packages/*

# One React in the tree, not just one in the catalog.
#
# The catalog governs what a workspace package asks for; it does not govern what
# pnpm picks to satisfy somebody else's OPTIONAL peer. @rocicorp/zero takes
# react as one, so packages/contracts (which has no react of its own) was
# resolved against a react nothing here asks for any more, giving it a second
# Zero instance. The apps then imported `queries` from one Zero and `useQuery`
# from another, and the two are structurally different types.
#
# An override rather than a lockfile clean-out, because the shape of the problem
# outlives any one lockfile: it comes back the next time a package with an
# optional react peer is added.
overrides:
  react: 19.2.3
  react-dom: 19.2.3

allowBuilds:
  "@rocicorp/zero-sqlite3": true
  ffmpeg-static: true
  "@tailwindcss/oxide": true
  esbuild: true
  protobufjs: true

# Single place to pin versions shared across packages (`"dep": "catalog:"`).
catalog:
  # runtime: clients
  #
  # Exact, and it is Expo's number rather than ours. Expo pins React and React
  # Native together as a pair, so apps/mobile cannot float; and a second React
  # version in the workspace is not free even though the two apps never meet at
  # runtime, because pnpm resolves optional peers per version and @rocicorp/zero
  # takes React as one. Two Reacts meant two Zero instances, which made
  # `queries` from @ragbag/contracts structurally incompatible with `useQuery`
  # in the app importing it. One version, one Zero.
  react: 19.2.3
  react-dom: 19.2.3
  "@tanstack/react-router": ^1.170.25
  "@tanstack/react-virtual": ^3.14.9
  zustand: ^5.0.14
  minisearch: ^7.2.0
  # runtime: sync (client + server + cache must stay in lockstep → exact pin)
  "@rocicorp/zero": 1.8.0
  # runtime: server
  hono: ^4.13.1
  "@hono/node-server": ^2.1.0
  better-auth: ^1.6.30
  drizzle-orm: ^0.45.2
  postgres: ^3.4.9
  "@aws-sdk/client-s3": ^3.1108.0
  "@aws-sdk/s3-request-presigner": ^3.1108.0
  openai: ^7.4.0
  linkedom: ^0.18.13
  "@mozilla/readability": ^0.6.0
  pdfjs-dist: ^6.2.108
  # Derivatives (plan §6.2): HEIC transcode, EXIF orientation, thumbs, true
  # dimensions.
  sharp: ^0.35.3
  # The HEVC half of HEIC, which sharp's bundled libheif cannot do: libheif
  # compiled to WASM, so it needs nothing from the base image and works in dev
  # too (see apps/server/src/ingest/derivatives.ts).
  heic-decode: ^2.1.0
  # The blurred stand-in that paints at the right geometry while a thumb is
  # fetched (plan §6.5). Pure JS, encoder server-side and decoder in the browser.
  thumbhash: ^0.1.1
  # pdfjs reaches for this at runtime to polyfill DOMMatrix/Path2D. Pinned to
  # the version pdfjs itself resolves so only one copy is ever installed.
  "@napi-rs/canvas": 1.0.5
  # Audio the transcription endpoint will not take (WhatsApp's .opus, a .aiff
  # off a Mac, anything past its 25 MB ceiling) is converted before upload
  # (apps/server/src/ingest/audio-input.ts). A prebuilt static binary rather
  # than an apt package, so dev machines and the runtime image get it the same
  # way; FFMPEG_PATH overrides it with a system one.
  ffmpeg-static: ^5.3.0
  # runtime: shared
  zod: ^4.4.3
  # v7, not v4: client-minted (offline capture) and time-sortable (index
  # locality, and any id tiebreak) while still being a plain UUID.
  uuid: ^14.0.1
  # tooling
  typescript: ^5.9.3
  tsx: ^4.23.12
  esbuild: ^0.28.2
  vite: ^8.2.1
  "@vitejs/plugin-react": ^6.0.5
  tailwindcss: ^4.3.3
  "@tailwindcss/vite": ^4.3.3
  vitest: ^4.1.10
  drizzle-kit: ^0.31.10
  "@types/node": ^26.2.0
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.4

minimumReleaseAgeExclude:
  - "@aws-sdk/checksums@3.1000.27"
  - "@aws-sdk/client-s3@3.1108.0"
  - "@aws-sdk/core@3.977.7"
  - "@aws-sdk/credential-provider-env@3.972.68"
  - "@aws-sdk/credential-provider-http@3.972.70"
  - "@aws-sdk/credential-provider-ini@3.973.13"
  - "@aws-sdk/credential-provider-login@3.972.75"
  - "@aws-sdk/credential-provider-node@3.972.79"
  - "@aws-sdk/credential-provider-process@3.972.68"
  - "@aws-sdk/credential-provider-sso@3.973.12"
  - "@aws-sdk/credential-provider-web-identity@3.972.74"
  - "@aws-sdk/middleware-sdk-s3@3.972.73"
  - "@aws-sdk/nested-clients@3.997.42"
  - "@aws-sdk/s3-request-presigner@3.1108.0"
  - "@aws-sdk/signature-v4-multi-region@3.996.44"
  - "@aws-sdk/token-providers@3.1108.0"
  - "@aws-sdk/types@3.974.3"
  - "@aws-sdk/xml-builder@3.972.38"
  - "@better-auth/core@1.6.27"
  - "@better-auth/drizzle-adapter@1.6.27"
  - "@better-auth/kysely-adapter@1.6.27"
  - "@better-auth/memory-adapter@1.6.27"
  - "@better-auth/mongo-adapter@1.6.27"
  - "@better-auth/prisma-adapter@1.6.27"
  - "@better-auth/telemetry@1.6.27"
  - better-auth@1.6.27
  - "@legendapp/list@3.3.8"
